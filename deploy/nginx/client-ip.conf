# Install as /etc/nginx/conf.d/client-ip.conf (http level). Task 1.2.
# Real visitor IP behind CloudFront. CloudFront-Viewer-Address ("ip:port") is trusted only when the
# request carries the secret X-Origin-Verify header that CloudFront adds; direct hits on the origin
# fall back to $remote_addr (the caller's own IP), so the header can't be spoofed to dodge limits.
#
# !! Replace REPLACE_WITH_SECRET on the server only. Never commit the real value.

map $http_x_origin_verify $from_cloudfront {
    "REPLACE_WITH_SECRET" 1;
    default               0;
}

map "$from_cloudfront|$http_cloudfront_viewer_address" $client_ip {
    "~^1\|(?<ip>.+):\d+$" $ip;
    default               $remote_addr;
}

# ponytail: one zone per endpoint group, all keyed on the real visitor IP
limit_req_zone $client_ip zone=clicks:10m rate=10r/m;   # 1.2: public link clicks
limit_req_zone $client_ip zone=forms:10m  rate=10r/m;   # 1.3: /api/leads (waitlist), /api/location
